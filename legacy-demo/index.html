</style><header><div class="logo">DRIO<i>Z</i><span class="tag"> PRIVATE PRODUCT PREVIEW</span></div><nav id="nav"></nav></header><div class="notice">Interactive demo · Illustrative fares and driver profiles · Schematic map · No real bookings, payments, GPS or emergency dispatch</div><main class="wrap" id="app"></main><footer>DRIOZ · Your car. Your time. &nbsp; / &nbsp; Built around a better journey.</footer><script>
const cities={'Hyderabad':['Madhapur','Rajiv Gandhi Airport','Jubilee Hills',249],'Bengaluru':['Indiranagar','Kempegowda Airport','Koramangala',299],'Delhi NCR':['Connaught Place','IGI Airport','Gurugram',299],'Mumbai':['Bandra West','Mumbai Airport','Andheri',349],'Visakhapatnam':['MVP Colony','Visakhapatnam Airport','Rushikonda',249],'Vijayawada':['Benz Circle','Vijayawada Airport','Moghalrajpuram',249]};let city='Hyderabad',role='Customer',step=0,online=true;let bookings=[];try{const saved=JSON.parse(localStorage.getItem('drioz-demo-v1')||'[]');if(Array.isArray(saved))bookings=saved}catch{}let current=null;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('drioz-demo-v1',JSON.stringify(bookings));function map(){return `<div class="map" aria-label="Schematic map, not live navigation"><svg viewBox="0 0 700 420" preserveAspectRatio="none"><defs><pattern id="blocks" width="115" height="85" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="93" height="63" rx="12" fill="#dce6df"/><path d="M0 80H115M110 0V85" stroke="white" stroke-width="10"/></pattern></defs><rect width="700" height="420" fill="url(#blocks)"/><path d="M-50 340Q180 280 290 370T750 220" fill="none" stroke="#c5dfe8" stroke-width="35"/><path d="M130 -30L280 220L550 230L680 470" fill="none" stroke="white" stroke-width="18"/><path d="M280 220L410 230L550 230L600 320" fill="none" stroke="#3869ff" stroke-width="5" stroke-dasharray="9 5"/></svg><span class="maplabel">${city} · Schematic preview</span><span class="district" style="left:15%;top:28%">${cities[city][0].toUpperCase()}</span><span class="district" style="right:9%;top:65%">${cities[city][2].toUpperCase()}</span><div class="pin"></div><div class="mapbottom"><div><b>Your city, at your pace.</b><div class="muted">Book a professional driver for your own car.</div></div><span class="pill">${step>1?'Demo trip':'City preview'}</span></div></div>`}function citySelect(){return `<select class="city" aria-label="Select city" onchange="city=this.value;step=0;current=null;render()">${Object.keys(cities).map(c=>`<option ${c===city?'selected':''}>${c}</option>`).join('')}</select>`}function switchRole(next){if(!['Customer','Driver','Admin'].includes(next))return;role=next;location.hash=next.toLowerCase();render();window.scrollTo({top:0,behavior:'instant'});}function render(){$('nav').innerHTML=['Customer','Driver','Admin'].map(r=>`<button class="${r===role?'active':''}" onclick="switchRole('${r}')">${r}</button>`).join('');$('app').innerHTML=role==='Customer'?customer():role==='Driver'?driver():admin();}function customer(){return `<section class="hero"><div class="herocopy reveal"><div class="eyebrow">PERSONAL DRIVERS. REIMAGINED.</div><h1>Take the<br>back seat.<br><em>Own your day.</em></h1><p>Your own car. A driver for the journey.<br>Make a little more room for what matters.</p><a class="herolink" href="#the-experience">Discover a different way to move <span>↗</span></a></div><section class="booking reveal" id="book">${step===0?form():trip()}</section></section><div class="cityrail"><span>DESIGNED FOR YOUR CITY</span>${Object.keys(cities).map(c=>`<button onclick="city='${c}';step=0;current=null;render();document.getElementById('book').scrollIntoView({block:'center'})">${c==='Visakhapatnam'?'Vizag':c}</button>`).join('')}</div><section class="editorial" id="the-experience"><div class="splitintro"><div><div class="eyebrow">LESS DRIVING. MORE LIVING.</div><h2>A driver for<br><em>every kind of day.</em></h2></div><p>For the airport rush, the long-awaited evening out, or the road that leads beyond the city. Keep the familiarity of your own car and choose the journey that fits your plans.</p></div><div class="servicelist">${[['01','One-way','An easier way across the city. Leave the driving to someone else.'],['02','Round trip','An evening out or a day of errands, with a ride back in your own car.'],['03','Hourly','Keep your plans flexible. A driver for the time you need.'],['04','Outstation','Take the longer route. Enjoy the journey beyond the city.']].map(([n,t,d])=>`<button class="service" onclick="step=0;current=null;render();document.getElementById('type').value='${t}';document.getElementById('book').scrollIntoView({block:'center'})"><span>${n} / YOUR JOURNEY</span><h3>${t}</h3><p>${d}</p><b>↗</b></button>`).join('')}</div></section><section class="brandband"><div><div class="eyebrow">A THOUGHTFUL EXPERIENCE</div><h2>Familiar comfort.<br>A fresh perspective.</h2><p>One simple flow, from the first plan<br>to the final destination.</p></div><div>${[['01','Set your plans','Choose your city, trip type and pickup time.'],['02','Review the details','See your estimated fare before creating a booking.'],['03','Follow the journey','Move through assignment, arrival and trip completion.']].map(([n,t,d])=>`<div class="timeline"><span>${n}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</div></section><section class="history"><div class="eyebrow">YOUR JOURNEYS</div><h3 style="margin-top:16px;font-weight:400;font-size:24px">A little more organised.</h3>${bookings.length?bookings.slice().reverse().map(b=>`<div class="listrow"><span><b>${esc(b.city)}</b> · ${esc(b.type)}<br><small>${esc(b.pickup)} → ${esc(b.destination)}</small></span><span>${esc(b.status)} · ₹${b.fare}</span></div>`).join(''):'<p class="muted">Your demo bookings will appear here. Start with the booking panel above.</p>'}</section><section class="faq"><div class="eyebrow">BEFORE YOU GO</div><h2>A few things to know.</h2><details><summary>Am I booking a car or a driver?</summary><p>DRIOZ is designed for booking a driver for your own car. You provide the vehicle.</p></details><details><summary>Can I schedule a trip for later?</summary><p>Yes. Select Schedule in the booking panel and choose a future date and time to try the flow.</p></details><details><summary>Which cities are included?</summary><p>Hyderabad, Bengaluru, Delhi NCR, Mumbai, Visakhapatnam and Vijayawada are included in this product preview. Live launch coverage is not confirmed.</p></details><details><summary>Does this preview make real bookings?</summary><p>No. Fares, driver profiles and trips are illustrative. Real booking, payments and tracking require the production backend and provider integrations.</p></details></section>`}function form(){return `<h3>Where shall we take you?</h3><div class="muted">Your vehicle. A driver for the journey.</div><label class="label">Service city</label>${citySelect()}<label class="label" for="type">Trip type</label><select id="type"><option>One-way</option><option>Round trip</option><option>Hourly</option><option>Outstation</option></select><label class="label" for="pickup">Pickup location</label><input id="pickup" value="${cities[city][0]}" maxlength="100"><label class="label" for="destination">Destination</label><input id="destination" value="${cities[city][1]}" maxlength="100"><div class="row"><div><label class="label" for="when">When</label><select id="when" onchange="$('schedule').classList.toggle('hidden',this.value==='Now')"><option>Now</option><option>Schedule</option></select></div><div><label class="label" for="gear">Transmission</label><select id="gear"><option>Automatic</option><option>Manual</option></select></div></div><input type="datetime-local" id="schedule" class="hidden" aria-label="Scheduled pickup time" style="margin-top:12px"><div class="error" id="error"></div><button class="primary full" onclick="estimate()">See fare estimate →</button><p class="muted">Demo pricing only. No charge will be made.</p>`}function estimate(){if(!$('pickup').value.trim()||!$('destination').value.trim()){$('error').textContent='Please enter both locations.';return}if($('when').value==='Schedule'&&(!$('schedule').value||new Date($('schedule').value)<new Date())){$('error').textContent='Choose a future pickup time.';return}const type=$('type').value;current={id:Date.now(),city,type,pickup:$('pickup').value.trim(),destination:$('destination').value.trim(),gear:$('gear').value,when:$('when').value==='Now'?'Now':$('schedule').value,fare:cities[city][3]*({'One-way':1,'Round trip':2,Hourly:2,Outstation:5}[type]),status:'Requested'};step=1;render()}function trip(){const b=current;return `<div class="eyebrow">${step===1?'YOUR FARE ESTIMATE':'YOUR DEMO JOURNEY'}</div><div class="steps">${[1,2,3,4].map(n=>`<span class="${n<=step?'done':''}"></span>`).join('')}</div><h2>${step===1?'All set to go?':esc(b.status)}</h2><p>${esc(b.pickup)} → ${esc(b.destination)}</p><div class="summary"><div class="listrow"><span>${esc(b.type)} · ${esc(b.gear)}</span><b>${esc(b.city)}</b></div><div class="listrow"><span>Illustrative service fare</span><b>₹${b.fare-49}</b></div><div class="listrow"><span>Illustrative booking fee</span><b>₹49</b></div><div class="price">₹${b.fare}</div><small class="muted">Sample total; taxes, overtime, night charges and final pricing need configuration. Pickup: ${esc(b.when)}</small></div>${step>1?`<div class="row" style="margin-top:20px"><div class="avatar">AK</div><div><b>Arjun K. · Demo driver</b><div class="muted">Sample profile · No live assignment</div></div></div>`:''}${step===1?'<button class="primary full" onclick="book()">Create demo booking →</button><button class="secondary full" onclick="step=0;render()">Edit trip</button>':`<button class="primary full" onclick="advance()" ${['Completed','Cancelled'].includes(b.status)?'disabled':''}>${b.status==='Requested'?'Simulate driver acceptance':b.status==='Assigned'?'Simulate arrival':b.status==='Arrived'?'Enter demo OTP to start':b.status==='In progress'?'Finish demo trip':'Journey ended'}</button><p class="muted">${b.status==='Arrived'?'Demo start code: 1234':'Try the Driver and Admin tabs to manage this same booking.'}</p><button class="secondary full" onclick="step=0;current=null;render()">Plan another trip</button>`}` }function book(){bookings.push(current);save();step=2;render()}function advance(id){const b=id?bookings.find(b=>b.id===id):current;if(!b)return;if(b.status==='Requested')b.status='Assigned';else if(b.status==='Assigned')b.status='Arrived';else if(b.status==='Arrived'){const code=prompt('Enter the demo trip-start OTP (1234)');if(code!=='1234'){if(code!==null)alert('Incorrect demo OTP. Trip has not started.');return}b.status='In progress'}else if(b.status==='In progress')b.status='Completed';if(current?.id===b.id){current=b;step=b.status==='Completed'?4:3}save();render()}let driverTab='overview';
function partnerTab(tab){driverTab=tab;render()}
function driver(){
const all=bookings.filter(b=>b.city===city),done=all.filter(b=>b.status==='Completed'),jobs=all.filter(b=>!['Completed','Cancelled'].includes(b.status)),earnings=done.reduce((sum,b)=>sum+Math.round(b.fare*.8),0),active=jobs.find(b=>b.status!=='Requested'),requests=jobs.filter(b=>b.status==='Requested');
return `<section class="partner-shell"><aside class="partner-sidebar"><div class="partner-wordmark">DRIOZ<span>PARTNER</span></div><div class="partner-person"><div class="partner-avatar">AK</div><div><strong>Arjun K.</strong><small>Demo partner · DZ001</small></div></div><div class="partner-nav">${[['overview','Overview','◫'],['trips','My trips','↗'],['earnings','Earnings','₹'],['account','My account','◎']].map(([key,label,icon])=>`<button class="${driverTab===key?'selected':''}" onclick="partnerTab('${key}')"><span>${icon}</span>${label}${key==='trips'&&jobs.length?`<b>${jobs.length}</b>`:''}</button>`).join('')}</div><div class="partner-sidebar-bottom"><span class="partner-dot"></span> ${online?'Available for demo requests':'Currently offline'}<p>YOUR CAR. YOUR TIME.</p></div></aside><div class="partner-main"><div class="partner-top"><div><span class="eyebrow">PARTNER WORKSPACE / ${esc(city.toUpperCase())}</span><h1>${driverTab==='earnings'?'Every journey adds up.':driverTab==='trips'?'Your journeys, organised.':driverTab==='account'?'Ready for the road.':'Your next opportunity.'}</h1><p>${driverTab==='overview'?'A clear road ahead. Let’s make it a good day.':'Your driving day, all in one place.'}</p></div><div class="partner-tools">${citySelect()}<button class="partner-presence ${online?'is-online':''}" aria-pressed="${online}" onclick="online=!online;render()"><i></i>${online?'Online':'Offline'}<span class="partner-toggle"></span></button></div></div>
${driverTab==='overview'||driverTab==='earnings'?`<div class="partner-metrics"><div class="partner-balance"><span>DEMO EARNINGS · ${esc(city.toUpperCase())}</span><strong>₹${earnings.toLocaleString('en-IN')}<small>.00</small></strong><div><span>${done.length} completed ${done.length===1?'journey':'journeys'}</span><button onclick="partnerTab('${driverTab==='earnings'?'trips':'earnings'}')">${driverTab==='earnings'?'View trips':'View earnings'} ↗</button></div></div><div class="partner-metric"><span>COMPLETED TRIPS</span><strong>${String(done.length).padStart(2,'0')}</strong><small>Across this demo session</small></div><div class="partner-metric"><span>ACTIVE JOURNEYS</span><strong>${String(jobs.length).padStart(2,'0')}</strong><small>${requests.length} awaiting acceptance</small></div></div>`:''}
${driverTab==='overview'?`<div class="partner-columns"><div class="partner-map-panel"><div class="partner-section-title"><h2>Your driving area</h2><span class="partner-badge">${online?'Available':'Offline'}</span></div>${map()}<div class="partner-map-caption"><span><i class="partner-dot"></i> ${esc(city)}</span><small>Schematic map · GPS not connected</small></div></div><div class="partner-dispatch"><div class="partner-section-title"><h2>${active?'Active journey':'Trip requests'}</h2><span>${active?'IN PROGRESS':String(requests.length).padStart(2,'0')}</span></div>${active?partnerJob(active):online&&requests.length?requests.map(partnerJob).join(''):`<div class="partner-empty"><div class="partner-radar"><span>↗</span></div><h3>${online?'Ready when you are.':'Take a breather.'}</h3><p>${online?'No requests in '+esc(city)+' yet. Create a customer booking to try your first trip.':'Go online when you’re ready to receive demo trip requests.'}</p><button class="partner-cta" onclick="${online?"switchRole('Customer')":"online=true;render()"}">${online?'Create a demo booking':'Go online'} ↗</button></div>`}</div></div><div class="partner-tip"><span>GOOD TO KNOW</span><p>Check the vehicle and confirm the customer’s trip-start code before you begin.</p><button onclick="partnerTab('account')">Partner checklist ↗</button></div>`:''}
${driverTab==='trips'?`<div class="partner-section-title"><h2>Journey history</h2><span>${all.length} TOTAL</span></div><div class="partner-trip-list">${all.length?all.slice().reverse().map(b=>partnerJob(b)).join(''):'<div class="partner-empty"><h3>Your first journey is ahead.</h3><p>Bookings from your selected city will appear here.</p><button class="partner-cta" onclick="switchRole(&quot;Customer&quot;)">Create a demo booking ↗</button></div>'}</div>`:''}
${driverTab==='earnings'?`<section class="partner-ledger"><div class="partner-section-title"><h2>Earnings activity</h2><span>SIMULATED</span></div>${done.length?done.slice().reverse().map(b=>`<div class="partner-ledger-row"><div><strong>${esc(b.pickup)} → ${esc(b.destination)}</strong><small>DZ${String(b.id).slice(-6)} · ${esc(b.type)}</small></div><b>+ ₹${Math.round(b.fare*.8)}</b></div>`).join(''):'<div class="partner-empty"><h3>A fresh start.</h3><p>Complete a demo journey to see an earnings entry.</p></div>'}<p class="partner-disclaimer">Calculated at 80% of illustrative fares. No real wallet, withdrawal or payout is connected.</p></section>`:''}
${driverTab==='account'?`<div class="partner-account"><div><div class="partner-avatar large">AK</div><h2>Arjun K.</h2><p>Illustrative partner profile</p><span class="partner-badge">Demo account</span></div><section><h2>Your launch checklist</h2>${[['01','Identity & licence','Verification is not connected.'],['02','Vehicle readiness','Check mirrors, tyres and basic controls.'],['03','Trip-start code','Ask the customer for their code before driving.'],['04','Support & safety','Live support and emergency dispatch are not connected.']].map(([n,t,d])=>`<div class="partner-check"><span>${n}</span><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</section></div>`:''}
<p class="partner-footnote">Product preview · Shared demo data in this browser · No real dispatch or payouts</p></div></section>`}
function partnerJob(b){const terminal=['Completed','Cancelled'].includes(b.status);return `<article class="partner-request"><div class="partner-request-head"><span>${esc(b.type.toUpperCase())}</span><span class="partner-badge">${esc(b.status)}</span></div><div class="partner-route"><div><i></i><small>PICKUP</small><strong>${esc(b.pickup)}</strong></div><div><i></i><small>DESTINATION</small><strong>${esc(b.destination)}</strong></div></div><div class="partner-job-meta"><span>${esc(b.gear||'Automatic')}</span><span>${esc(b.when==='Now'?'Immediate pickup':b.when||'Now')}</span></div><div class="partner-request-pay"><div><small>EST. PARTNER EARNINGS</small><strong>₹${Math.round(b.fare*.8)}</strong></div>${!terminal&&(online||b.status!=='Requested')?`<button class="partner-cta" onclick="advance(${b.id})">${b.status==='Requested'?'Accept demo job':b.status==='Assigned'?'Mark arrived':b.status==='Arrived'?'Start with demo OTP':'Complete demo trip'} ↗</button>`:`<span>${terminal?'Journey closed':'Go online to accept'}</span>`}</div>${b.status==='Arrived'?'<small class="partner-disclaimer">Demo customer code: 1234</small>':''}</article>`}
function admin(){const rows=bookings.filter(b=>b.city===city);return `<div class="intro"><div><div class="eyebrow">DRIOZ / OPERATIONS</div><h1>A clear view of your city.</h1><p>Bookings, partner activity and trip oversight in one place.</p></div>${citySelect()}</div><div class="stats" style="margin-bottom:22px"><div class="card"><span class="muted">CITY BOOKINGS</span><strong>${rows.length}</strong><span class="pill">${city}</span></div><div class="card"><span class="muted">ACTIVE JOURNEYS</span><strong>${rows.filter(b=>!['Completed','Cancelled'].includes(b.status)).length}</strong><span class="muted">Across demo trip stages</span></div><div class="card"><span class="muted">COMPLETED DEMO FARES</span><strong>₹${rows.filter(b=>b.status==='Completed').reduce((s,b)=>s+b.fare,0)}</strong><span class="muted">Illustrative · No real revenue</span></div></div><div class="card"><h3>Booking control</h3><div class="tablewrap"><table><thead><tr><th>REFERENCE</th><th>ROUTE</th><th>SERVICE</th><th>FARE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>${rows.map(b=>`<tr><td>DZ${String(b.id).slice(-6)}</td><td>${esc(b.pickup)}<br><small class="muted">${esc(b.destination)}</small></td><td>${esc(b.type)}</td><td>₹${b.fare}</td><td><span class="pill">${b.status}</span></td><td>${!['Completed','Cancelled'].includes(b.status)?`<button onclick="advance(${b.id})">${b.status==='Requested'?'Assign demo driver':'Advance trip'}</button> <button class="secondary" onclick="cancel(${b.id})">Cancel</button>`:'—'}</td></tr>`).join('')}</tbody></table>${!rows.length?'<div class="empty">No demo bookings for this city yet.</div>':''}</div></div><div class="grid" style="margin-top:22px"><div class="card"><h3>City configuration</h3><p class="muted">Six initial launch markets. Illustrative starting fares:</p>${Object.keys(cities).map(c=>`<div class="listrow"><span>${c}</span><b>₹${cities[c][3]}</b></div>`).join('')}</div><div class="card"><h3>Production readiness</h3><p>This preview shares state between roles in this browser only. It is not an authenticated operations system.</p><div class="listrow">Next: secure customer, partner and staff accounts</div><div class="listrow">Next: dispatch, live GPS and notifications</div><div class="listrow">Next: payment settlement and driver verification</div><div class="listrow">Next: service zones, support escalation and audit trail</div></div></div>`}function cancel(id){if(!confirm('Cancel this demo booking?'))return;const b=bookings.find(b=>b.id===id);b.status='Cancelled';save();render()}const initialRole=location.hash.slice(1).toLowerCase();role=({customer:'Customer',driver:'Driver',admin:'Admin'})[initialRole]||'Customer';window.addEventListener('hashchange',()=>{role=({customer:'Customer',driver:'Driver',admin:'Admin'})[location.hash.slice(1).toLowerCase()]||'Customer';render()});window.addEventListener('storage',event=>{if(event.key==='drioz-demo-v1'){try{const data=JSON.parse(event.newValue||'[]');if(Array.isArray(data)){bookings=data;current=current?bookings.find(b=>b.id===current.id)||null:null;if(!current)step=0;render()}}catch{}}});render();
</script></html>
