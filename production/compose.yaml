# Local infrastructure only. Production requires managed secrets, TLS, backups and restricted network access.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: drioz
      POSTGRES_PASSWORD: localonly
      POSTGRES_DB: drioz
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drioz"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
